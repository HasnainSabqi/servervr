<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liumi Labs</title>
    
    <!-- 1. A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- 2. Orbit Controls for smooth camera dragging -->
    <script src="https://unpkg.com/aframe-orbit-controls@1.3.0/dist/aframe-orbit-controls.min.js"></script>
    <!-- 3. Tailwind CSS for the 2D Dashboard UI -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Ensure the A-Frame canvas stays behind the UI */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #030712; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; pointer-events: none; }
        .pointer-auto { pointer-events: auto; }
        .a-canvas { display: block !important; }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 2D UI DASHBOARD OVERLAY (Tailwind CSS)     -->
    <!-- ========================================== -->
    <div id="ui-layer" class="font-sans">
        <!-- Top Navigation Bar -->
        <div class="w-full p-4 bg-gray-950/80 backdrop-blur-md border-b border-gray-800 flex justify-between items-center text-white pointer-auto">
            <div class="flex items-center gap-4">
                <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse shadow-[0_0_10px_#22c55e]"></div>
                <h1 class="text-2xl font-black tracking-widest text-cyan-400">Server<span class="text-white font-light">VR</span></h1>
                <span class="px-3 py-1 bg-gray-800 rounded-md text-xs text-gray-300 ml-4 border border-gray-700">Liumi Labs Render Engine</span>
            </div>
            <div class="text-sm text-gray-400 font-mono flex gap-6">
                <span>ACTIVE NODES: <span id="ui-node-count" class="text-cyan-400 font-bold">4</span></span>
                <span>SYSTEM: <span class="text-green-400 font-bold">OPTIMAL</span></span>
            </div>
        </div>

        <!-- Right Side Control Panel -->
        <div class="absolute top-24 right-6 w-72 p-6 bg-gray-950/80 backdrop-blur-xl border border-gray-700 rounded-2xl text-white shadow-2xl pointer-auto">
            <h2 class="text-xs text-gray-400 uppercase tracking-widest mb-4 border-b border-gray-800 pb-2">Simulation Engine</h2>
            
            <div class="mb-6">
                <div class="flex justify-between text-xs mb-2">
                    <span class="text-gray-300">Floor Capacity</span>
                    <span id="ui-capacity" class="text-cyan-400 font-bold">33%</span>
                </div>
                <div class="w-full bg-gray-800 rounded-full h-2 shadow-inner">
                    <div id="ui-capacity-bar" class="bg-cyan-500 h-2 rounded-full transition-all duration-500 shadow-[0_0_10px_#06b6d4]" style="width: 33%"></div>
                </div>
            </div>

            <button onclick="deployNewCabinet()" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 rounded-lg transition-all font-bold shadow-[0_0_15px_rgba(8,145,178,0.4)] hover:shadow-[0_0_25px_rgba(8,145,178,0.8)] border border-cyan-400 uppercase tracking-wider text-sm">
                + Deploy New Cabinet
            </button>
            <p class="text-xs text-gray-500 mt-4 text-center">Left-Click & Drag to rotate.<br>Scroll to zoom.</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3D SCENE (A-FRAME)                         -->
    <!-- ========================================== -->
    <a-scene background="color: #020617" renderer="antialias: true; colorManagement: true;">
        
        <!-- Assets (Textures) -->
        <a-assets>
            <img id="gridPattern" src="https://cdn.aframe.io/a-painter/images/floor.jpg" crossorigin="anonymous">
        </a-assets>

        <!-- Camera & Controls -->
        <a-entity camera look-controls orbit-controls="target: 0 1 0; minDistance: 3; maxDistance: 25; initialPosition: 0 6 10"></a-entity>

        <!-- Lighting -->
        <a-entity light="type: ambient; color: #1e293b; intensity: 1.5"></a-entity>
        <a-entity light="type: directional; color: #e0f2fe; intensity: 1; castShadow: true" position="-5 10 5"></a-entity>
        <a-entity light="type: point; color: #38bdf8; intensity: 0.5; distance: 20" position="0 5 0"></a-entity>

        <!-- The Floor -->
        <a-plane rotation="-90 0 0" width="40" height="40" material="color: #0f172a; metalness: 0.2; roughness: 0.8; src: #gridPattern; repeat: 40 40; transparent: true; opacity: 0.4"></a-plane>
        <a-grid width="40" height="40" spacing="2" opacity="0.1"></a-grid>

        <!-- Container for dynamically generated servers -->
        <a-entity id="server-container"></a-entity>
        
    </a-scene>

    <!-- ========================================== -->
    <!-- JAVASCRIPT: Logic & Real-Time Simulation   -->
    <!-- ========================================== -->
    <script>
        const container = document.getElementById('server-container');
        const activeServers = [];
        const maxServers = 12; // Grid limit for this demo

        // Function to create a 3D Server dynamically
        function createServerGroup(x, z, idStr) {
            const group = document.createElement('a-entity');
            group.setAttribute('position', `${x} 0 ${z}`);

            // 1. Main Cabinet Box
            const cabinet = document.createElement('a-entity');
            cabinet.setAttribute('geometry', 'primitive: box; width: 1.2; height: 3; depth: 1.5');
            cabinet.setAttribute('material', 'color: #1e293b; metalness: 0.7; roughness: 0.3');
            cabinet.setAttribute('position', '0 1.5 0');
            
            // 2. Status LED Strip
            const led = document.createElement('a-entity');
            led.setAttribute('geometry', 'primitive: box; width: 0.8; height: 0.1; depth: 0.05');
            led.setAttribute('material', 'color: #10b981; shader: flat'); // Starts Green
            led.setAttribute('position', '0 2.8 0.76');

            // 3. Floating Holographic Data Screen (UI Panel)
            const screen = document.createElement('a-entity');
            screen.setAttribute('geometry', 'primitive: plane; width: 1.5; height: 0.9');
            screen.setAttribute('material', 'color: #000000; opacity: 0.75; transparent: true');
            screen.setAttribute('position', '0 3.8 0');
            
            // 4. Text on the Screen
            const text = document.createElement('a-text');
            text.setAttribute('value', `${idStr}\nInitializing...`);
            text.setAttribute('color', '#38bdf8');
            text.setAttribute('align', 'center');
            text.setAttribute('width', '3.5');
            text.setAttribute('line-height', '60');
            text.setAttribute('position', '0 0 0.02'); // Slightly in front of plane

            // 5. Emergency Red Light (Hidden by default, turns on if overheated)
            const warningLight = document.createElement('a-entity');
            warningLight.setAttribute('light', 'type: point; color: #ef4444; intensity: 0; distance: 4');
            warningLight.setAttribute('position', '0 2.8 1');

            // Construct the group
            screen.appendChild(text);
            group.appendChild(cabinet);
            group.appendChild(led);
            group.appendChild(screen);
            group.appendChild(warningLight);
            
            container.appendChild(group);

            // Store references so we can update them in real-time later
            return {
                id: idStr,
                ledEl: led,
                textEl: text,
                lightEl: warningLight
            };
        }

        // Add a new server via the UI button
        function deployNewCabinet() {
            if (activeServers.length >= maxServers) {
                alert("Floor capacity reached for this zone!");
                return;
            }

            // Calculate grid position (Rows of 4)
            const count = activeServers.length;
            const x = -3 + ((count % 4) * 2); // Spacing on X axis
            const z = Math.floor(count / 4) * 2.5; // Spacing on Z axis
            
            const id = 'RACK-' + Math.random().toString(36).substr(2, 4).toUpperCase();
            
            const serverData = createServerGroup(x, z, id);
            activeServers.push(serverData);

            updateUI();
        }

        // Update the 2D Dashboard UI numbers
        function updateUI() {
            document.getElementById('ui-node-count').innerText = activeServers.length;
            const percentage = Math.round((activeServers.length / maxServers) * 100);
            document.getElementById('ui-capacity').innerText = percentage + '%';
            document.getElementById('ui-capacity-bar').style.width = percentage + '%';
        }

        // Simulate Real-Time API Data (Updates every 2 seconds)
        setInterval(() => {
            activeServers.forEach(server => {
                // Generate random server stats
                const temp = Math.floor(Math.random() * (95 - 40 + 1)) + 40; // 40C to 95C
                const cpu = Math.floor(Math.random() * 100);
                
                const isCritical = temp > 82; // Threshold for overheating

                // Update 3D Text
                const statusText = isCritical ? '[ CRITICAL ]' : '[ OPTIMAL ]';
                server.textEl.setAttribute('value', `${server.id}\n${statusText}\nTemp: ${temp} C\nCPU: ${cpu}%`);
                
                // Change Colors based on health
                if (isCritical) {
                    server.textEl.setAttribute('color', '#ef4444'); // Red text
                    server.ledEl.setAttribute('material', 'color: #ef4444'); // Red LED
                    server.lightEl.setAttribute('light', 'intensity: 1.5'); // Turn on red floor glow
                } else {
                    server.textEl.setAttribute('color', '#38bdf8'); // Cyan text
                    server.ledEl.setAttribute('material', 'color: #10b981'); // Green LED
                    server.lightEl.setAttribute('light', 'intensity: 0'); // Turn off red glow
                }
            });
        }, 2000);

        // Initialize scene with 4 servers
        window.onload = () => {
            deployNewCabinet();
            deployNewCabinet();
            deployNewCabinet();
            deployNewCabinet();
        };
    </script>
</body>
</html>
